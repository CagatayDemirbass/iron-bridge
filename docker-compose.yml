services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskiron
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskiron"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - taskiron-postgres:/var/lib/postgresql/data

volumes:
  taskiron-postgres:
